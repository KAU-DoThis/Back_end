# main에 머지되면 개발 서버(EC2)에 자동 배포한다.
# Actions 탭 → "Deploy to EC2" → "Run workflow" 버튼으로 손으로도 실행할 수 있다.
#
# 흐름: 이미지 빌드 → ECR에 올리기 → SSM으로 EC2에 deploy.sh 실행
# AWS 접속은 OIDC(임시 자격증명)로 한다. 레포에 AWS 키를 저장하지 않는다.
#
# 필요한 레포 Variables (Settings → Secrets and variables → Actions → Variables)
#   AWS_ROLE_ARN     : GitHub Actions가 쓸 IAM 역할 ARN
#   EC2_INSTANCE_ID  : 배포할 EC2 인스턴스 ID (fintris-dev)

name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않게 한 번에 하나씩만 실행한다.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC 토큰 발급
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: fintris-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: AWS 로그인 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 서버가 켜져 있는지 확인
        run: |
          state=$(aws ec2 describe-instances --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "EC2 상태: $state"
          if [ "$state" != "running" ]; then
            echo "::error::fintris-dev 서버가 꺼져 있습니다($state). 콘솔에서 서버를 켠 뒤 Actions에서 'Re-run jobs'를 눌러 주세요."
            exit 1
          fi

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 후 ECR에 올리기
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          # ECR 태그는 덮어쓸 수 없게 설정돼 있으므로, 같은 커밋 이미지가 이미 있으면 다시 만들지 않는다.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="${{ github.sha }}" > /dev/null 2>&1; then
            echo "이미 올라간 이미지라 빌드를 건너뜁니다: $IMAGE"
          else
            docker build --platform linux/amd64 -t "$IMAGE" .
            docker push "$IMAGE"
          fi

      - name: EC2에 배포 (SSM Run Command)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy
          TAG: ${{ github.sha }}
        run: |
          # 서버에서 실행할 명령: 이 커밋의 배포 파일을 받아서 deploy.sh 실행
          jq -n --arg raw "$RAW_BASE" --arg tag "$TAG" '{commands: [
            "set -euo pipefail",
            "mkdir -p /opt/fintris && cd /opt/fintris",
            "curl -fsSL \($raw)/docker-compose.yml -o docker-compose.yml",
            "curl -fsSL \($raw)/Caddyfile -o Caddyfile",
            "curl -fsSL \($raw)/deploy.sh -o deploy.sh",
            "bash deploy.sh \($tag)"
          ]}' > params.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${TAG:0:7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM 명령 ID: $command_id"

          # 끝날 때까지 기다린다 (최대 10분)
          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "----- 서버 출력 -----"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true

          if [ "$status" != "Success" ]; then
            echo "::error::배포 실패 (상태: $status). 위 서버 출력을 확인하세요."
            exit 1
          fi
          echo "배포 성공: ${TAG:0:7}"
