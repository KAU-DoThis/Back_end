spring:
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

server:
  # Caddy(HTTPS) 뒤에서 X-Forwarded-Proto·Host를 읽어 https 주소를 만든다 (Swagger 서버 주소 등)
  # 앱 포트는 서버 안(127.0.0.1)에만 열려 있어 이 헤더는 Caddy만 보낼 수 있다
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-exp-ms: ${JWT_ACCESS_EXP_MS:3600000} # 1시간
  refresh-exp-ms: ${JWT_REFRESH_EXP_MS:1209600000} # 14일

kakao:
  user-info-uri: https://kapi.kakao.com/v2/user/me

codef:
  base-url: ${CODEF_BASE_URL:https://development.codef.io}
  oauth-url: https://oauth.codef.io/oauth/token
  client-id: ${CODEF_CLIENT_ID}
  client-secret: ${CODEF_CLIENT_SECRET}
  public-key: ${CODEF_PUBLIC_KEY}
  connected-id-key: ${CODEF_CONNECTED_ID_KEY}

ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}

sync:
  scheduler:
    enabled: ${SYNC_SCHEDULER_ENABLED:true}
